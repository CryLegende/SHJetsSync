name: SHJetsSync
version: '${project.version}'
main: org.Cry_Legende.sHJetsSync.SHJetsSync
api-version: '1.20'
author: Cry_Legende
description: Temps de jeu de JetsAntiAFKPro partagé entre les serveurs Opale du réseau
# Ce plugin n'a de sens que sur un réseau de serveurs Opale : à ne pas poser sur un serveur seul.
depend:
  - SHNetwork
  - JetsAntiAFKPro
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1
